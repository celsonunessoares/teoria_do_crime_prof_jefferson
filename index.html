                    <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3">1. Nomenclatura e Histórico dos Códigos Penais no Brasil</h3>
                    <p class="mb-3 text-slate-600 dark:text-slate-300">A discussão entre as expressões <strong>Direito Penal</strong> e <strong>Direito Criminal</strong> tem respaldo constitucional (Art. 22, I da CF/88). No Brasil independente, a expressão "Direito Criminal" foi utilizada uma única vez: no Código Criminal do Império de 1830. Todos os códigos posteriores adotaram "Direito Penal".</p>
                    <ul class="list-disc pl-5 mb-4 space-y-1 text-slate-600 dark:text-slate-300">
                        <li><strong>Período Colonial:</strong> Ordenações Afonsinas, Manoelinas e Filipinas.</li>
                        <li><strong>1830:</strong> Código Criminal do Império do Brasil.</li>
                        <li><strong>1890:</strong> Código Penal dos Estados Unidos do Brasil.</li>
                        <li><strong>1932:</strong> Consolidação das Leis Penais.</li>
                        <li><strong>1940:</strong> Código Penal de 1940 (sua parte especial, com alterações, vigora até hoje).</li>
                        <li><strong>1969:</strong> Código Penal de 1969 (teve vacatio legis de 9 anos, mas nunca entrou em vigor).</li>
                        <li><strong>1984:</strong> Lei nº 7.209/1984, que revogou a parte geral do Código de 1940 e instituiu a atual parte geral (arts. 1º ao 120).</li>
                    </ul>
                    <p class="mb-4 text-slate-600 dark:text-slate-300">Portanto, o atual Código possui <strong>Parte Geral</strong> (arts. 1º a 120, de 1984) e <strong>Parte Especial</strong> (arts. 121 a 361, de 1940 com reformas).</p>

                    <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3">2. Conceito de Código Penal e de Direito Penal</h3>
                    <p class="mb-3 text-slate-600 dark:text-slate-300"><strong>Código Penal:</strong> Conjunto de normas num único diploma legal que visam definir crimes (proibindo ou impondo condutas) sob ameaça de sanção para imputáveis e medida de segurança para inimputáveis, criando normas de aplicação geral para toda a legislação penal extravagante.</p>
                    <p class="mb-4 text-slate-600 dark:text-slate-300"><strong>Direito Penal (Bittencourt):</strong> Conjunto de normas jurídicas que tem por objeto a determinação de infrações de natureza penal e suas sanções correspondentes (penas e medidas de segurança).</p>

                    <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3">3. Os Três Aspectos / Dimensões do Direito Penal</h3>
                    <ul class="list-disc pl-5 mb-4 space-y-2 text-slate-600 dark:text-slate-300">
                        <li><strong>Aspecto Formal / Estático:</strong> Conjunto de normas que qualifica certos comportamentos humanos como infrações penais, define agentes e fixa sanções.</li>
                        <li><strong>Aspecto Material:</strong> Refere-se a comportamentos altamente reprováveis ou danosos ao organismo social, afetando bens jurídicos indispensáveis à conservação e progresso da sociedade.</li>
                        <li><strong>Aspecto Sociológico / Dinâmico:</strong> Instrumento de controle social de comportamentos desviados visando assegurar a disciplina para a harmônica convivência social.</li>
                    </ul>

                    <h3 class="text-xl font-bold text-slate-900 dark:text-white mb-3">4. Características e Princípios Fundamentais</h3>
                    <p class="mb-3 text-slate-600 dark:text-slate-300">O Direito Penal é ramo do <strong>Direito Público</strong>, ciência cultural (dever ser), valorativa, normativa, finalista, com caráter sancionador e <strong>caráter fragmentário</strong> (tutela apenas os bens mais importantes, sendo a <em>ultima ratio</em>, o "soldado de reserva" ou a "derradeira trincheira").</p>
                    <p class="mb-4 text-slate-600 dark:text-slate-300"><strong>Classificações:</strong> Objetivo (leis em vigor / poder de pular do Estado) x Subjetivo (direito de punir do Estado, monopólio estatal limitado). Substantivo (material) x Adjetivo (processual). Fundamental (Parte Geral) x Complementar (extravagante).</p>

        function shuffleQuestionAlternatives(questionId, alternatives, correctLetter) {
        // Gerador pseudoaleatório reproduzível para cada questão.
        // Mantém a mesma ordem ao recarregar a página.
        function createRandom(seedValue) {
        let seed = seedValue >>> 0;

        return function () {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
        };
        }

        const letters = ["A", "B", "C", "D"];

        // Identifica a posição da questão dentro de um grupo de quatro.
        const groupIndex = Math.floor((questionId - 1) / 4);
        const positionInGroup = (questionId - 1) % 4;

        // Embaralha a distribuição do gabarito em cada grupo de quatro.
        // Cada grupo terá uma resposta A, uma B, uma C e uma D.
        const groupLetters = [...letters];
        const groupRandom = createRandom(918273 + groupIndex * 7919);

        for (let i = groupLetters.length - 1; i > 0; i--) {
        const j = Math.floor(groupRandom() * (i + 1));
        [groupLetters[i], groupLetters[j]] =
        [groupLetters[j], groupLetters[i]];
        }

        const targetCorrectLetter = groupLetters[positionInGroup];

        // Cria a lista de alternativas identificando a resposta correta.
        const shuffled = Object.entries(alternatives).map(
        ([letter, text]) => ({
        text,
        isCorrect: letter === correctLetter
        })
        );

        // Embaralha todas as alternativas da questão.
        const random = createRandom(questionId * 2654435761);

        for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }

        // Garante que o gabarito fique na letra planejada.
        const correctIndex = shuffled.findIndex(
        alternative => alternative.isCorrect
        );

        const targetIndex = letters.indexOf(targetCorrectLetter);

        if (correctIndex === -1) {
        throw new Error(
        `Questão ${questionId}: alternativa correta não encontrada.`
        );
        }

        [shuffled[correctIndex], shuffled[targetIndex]] =
        [shuffled[targetIndex], shuffled[correctIndex]];

        // Reconstrói as alternativas A, B, C e D.
        const mappedAlternatives = {};
        let mappedCorrectLetter = "";

        shuffled.forEach((alternative, index) => {
        const letter = letters[index];

        mappedAlternatives[letter] = alternative.text;

        if (alternative.isCorrect) {
        mappedCorrectLetter = letter;
        }
        });

        return {
        alternatives: mappedAlternatives,
        correctLetter: mappedCorrectLetter
        };
        }

                                    D: "A experiência dos carros em Bronx e Palo Alto provou que a criminalidade é imune ao ambiente físico."
                                },
                                {
                                    A: "A fonte material de produção do Direito Penal é privativa da União, conforme o artigo 22, inciso I, da Constituição Federal.",
                                    B: "Os Estados-membros possuem competência legislativa plena e concorrente para criar tipos penais incriminadores sem restrições.",
                                    C: "Os costumes são considerados fontes formais imediatas principais capazes de criar novos crimes autônomos.",
                                    D: "A jurisprudência é a única fonte formal admitida no ordenamento penal brasileiro."
                                },
                                {
                                    A: "Prevalece na jurisprudência e na doutrina dominante (3ª corrente) que existe costume abolicionista capaz de revogar leis penais vigentes.",
                                    B: "O costume abolicionista é plenamente aceito pelo Superior Tribunal de Justiça para revogar contravenções penais como o jogo do bicho.",
                                    C: "Prevalece que não existe costume abolicionista; enquanto não revogada por outra lei, a norma penal tem plena eficácia, conforme a LINDB.",
                                    D: "Os costumes podem ab-rogar tipos penais desde que haja desuso prolongado pela sociedade."
                                }
                            ];

                            const templateIndex = (qId + levelIndex) % optionsStore.length;
                            const templateChoice = optionsStore[templateIndex];
                            correctLetter = ["B", "B", "A", "C"][templateIndex];
                            altTexts = templateChoice;

                            if (correctLetter === "A") explanationText =
                                "A alternativa A é a correta para este enunciado com base nas diretrizes doutrinárias do material oficial.";
                            else if (correctLetter === "B") explanationText =
                                "A alternativa B está correta, refletindo com exatidão os conceitos e dispositivos legais abordados no material base.";
                            else if (correctLetter === "C") explanationText =
                                "A alternativa C é a correta, em perfeita harmonia com a doutrina penal e as regras de eficácia normativa.";
                            else explanationText =
                                "A alternativa D apresenta a proposição correta de acordo com a interpretação sistemática do Direito Penal e das fontes formais.";
                        }

                        const originalCorrectLetter = correctLetter;
                        const shuffledQuestion = shuffleQuestionAlternatives(qId, altTexts, originalCorrectLetter);
                        const explanationWithShuffledLetter = explanationText.replace(
                            new RegExp(`(alternativa )${originalCorrectLetter}\\b`, "gi"),
                            `$1${shuffledQuestion.correctLetter}`
                        );

                        if (answerBankNeedsMigration && savedAnswersForMigration[qId]) {
                            const savedAnswer = savedAnswersForMigration[qId];
                            const oldLetter = typeof savedAnswer === "string" ? savedAnswer : savedAnswer.selected;
                            const oldSelectedText = altTexts[oldLetter];
                            const migratedLetter = Object.keys(shuffledQuestion.alternatives).find(
                                letter => shuffledQuestion.alternatives[letter] === oldSelectedText
                            );

                            if (migratedLetter) {
                                savedAnswersForMigration[qId] = {
                                    ...(typeof savedAnswer === "object" ? savedAnswer : {}),
                                    selected: migratedLetter,
                                    ...(typeof savedAnswer === "object" && savedAnswer.answered ? {
                                        correct: migratedLetter === shuffledQuestion.correctLetter
                                    } : {})
                                };
                            } else {
                                delete savedAnswersForMigration[qId];
                            }
                        }

                        questionsData.push({
                            id: qId,
                            bloco: blocoNum,
                            dificuldade: diffLevel,
                            assunto: subject,
                            enunciado: enunciadoText,
                            alternativas: shuffledQuestion.alternatives,
                            respostaCorreta: shuffledQuestion.correctLetter,
                            explicacao: explanationWithShuffledLetter
                        });

                        qId++;
                    }
                }
            }

            if (answerBankNeedsMigration) {
                localStorage.setItem('juris_userAnswers', JSON.stringify(savedAnswersForMigration));
                localStorage.setItem('juris_answerBankVersion', QUESTION_BANK_VERSION);
            }
        }

        // Initialize question bank
        generateQuestionsBank();

        // Application State Management
        let appState = {
            currentView: 'home', // 'home', 'study', 'quiz', 'result', 'review'
            activeBloco: 1,
            currentQuestionIndex: 0,
            userAnswers: JSON.parse(localStorage.getItem('juris_userAnswers')) || {}, // { questionId: 'A' }
            blockTimers: JSON.parse(localStorage.getItem('juris_blockTimers')) || {
                1: 0,
                2: 0,
                3: 0,
                4: 0
            },
            timerInterval: null,
            darkMode: localStorage.getItem('juris_darkMode') === 'true',
            reviewedOnlyErrors: false
        };

        // Initialize Theme on load
        if (appState.darkMode) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        // Core App Controller Object
        const app = {
            navigateTo(view, bloco = 1) {
                appState.currentView = view;
                appState.activeBloco = bloco;
                if (view === 'quiz' || view === 'study') {
                    if (view === 'quiz' && !appState.timerInterval) {
                        this.startTimer();
                    }
                } else {
                    this.stopTimer();
                }
                this.render();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            },

            toggleTheme() {
                appState.darkMode = !appState.darkMode;
                localStorage.setItem('juris_darkMode', appState.darkMode);
                if (appState.darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            },

            startTimer() {
                if (appState.timerInterval) clearInterval(appState.timerInterval);
                appState.timerInterval = setInterval(() => {
                    const b = appState.activeBloco;
                    appState.blockTimers[b] = (appState.blockTimers[b] || 0) + 1;
                    localStorage.setItem('juris_blockTimers', JSON.stringify(appState.blockTimers));
                    const timerEl = document.getElementById('liveTimerDisplay');
                    if (timerEl) {
                        timerEl.innerText = this.formatTime(appState.blockTimers[b]);
                    }
                }, 1000);
            },

            stopTimer() {
                if (appState.timerInterval) {
                    clearInterval(appState.timerInterval);
                    appState.timerInterval = null;
                }
            },

            formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}min ${secs < 10 ? '0' : ''}${secs}s`;
            },

            formatTotalTime() {
                const totalSecs = Object.values(appState.blockTimers).reduce((a, b) => a + b, 0);
                return this.formatTime(totalSecs);
            },

            saveProgress() {
                localStorage.setItem('juris_userAnswers', JSON.stringify(appState.userAnswers));
                localStorage.setItem('juris_answerBankVersion', QUESTION_BANK_VERSION);
            },

            selectOption(qId, letter) {
                appState.userAnswers[qId] = {
                    selected: letter,
                    answered: false
                };
                this.saveProgress();
                this.renderQuizQuestion();
            },

            submitAnswer(qId) {
                const ansObj = appState.userAnswers[qId];
                if (!ansObj || !ansObj.selected) return;

                const q = questionsData.find(item => item.id === qId);
                const isCorrect = (ansObj.selected === q.respostaCorreta);

                appState.userAnswers[qId] = {
                    ...ansObj,
                    answered: true,
                    correct: isCorrect
                };
                this.saveProgress();
                this.renderQuizQuestion();
            },

            nextQuestion() {
                const blockQs = questionsData.filter(q => q.bloco === appState.activeBloco);
                if (appState.currentQuestionIndex < blockQs.length - 1) {
                    appState.currentQuestionIndex++;
                    this.renderQuizQuestion();
                } else {
                    this.navigateTo('result', appState.activeBloco);
                }
            },

            prevQuestion() {
                if (appState.currentQuestionIndex > 0) {
                    appState.currentQuestionIndex--;
                    this.renderQuizQuestion();
                }
            },

            jumpToQuestion(index) {
                appState.currentQuestionIndex = index;
                this.renderQuizQuestion();
            },

            confirmResetBlock(bloco) {
                this.showModal(
                    "fa-triangle-exclamation text-amber-500 bg-amber-50 dark:bg-amber-950/50",
                    "Reiniciar Bloco " + bloco,
                    "Tem certeza de que deseja reiniciar todo o progresso e as respostas deste bloco? Esta ação não pode ser desfeita.",
                    [{
                            text: "Cancelar",
                            class: "px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium text-sm",
                            onclick: "app.closeModal()"
                        },
                        {
                            text: "Sim, Reiniciar",
                            class: "px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm shadow-md",
                            onclick: `app.executeResetBlock(${bloco})`
                        }
                    ]
                );
            },

            executeResetBlock(bloco) {
                const blockQs = questionsData.filter(q => q.bloco === bloco);
                blockQs.forEach(q => {
                    delete appState.userAnswers[q.id];
                });
                appState.blockTimers[bloco] = 0;
                this.saveProgress();
                localStorage.setItem('juris_blockTimers', JSON.stringify(appState.blockTimers));
                this.closeModal();
                this.navigateTo('home');
            },

            confirmResetAll() {
                this.showModal(
                    "fa-triangle-exclamation text-rose-500 bg-rose-50 dark:bg-rose-950/50",
                    "Reiniciar Simulado Completo",
                    "Tem certeza de que deseja apagar todo o progresso de todos os 4 blocos e zerar o cronômetro geral?",
                    [{
                            text: "Cancelar",
                            class: "px-4 py-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium text-sm",
                            onclick: "app.closeModal()"

                            text: "Sim, Apagar Tudo",
                            class: "px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-medium text-sm shadow-md",
                            onclick: "app.executeResetAll()"
                        }
                    ]

                appState.userAnswers = {};

                    2: 0,
                    3: 0,
                    4: 0

                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalMessage').innerText = message;

                const btnContainer = document.getElementById('modalButtons');
                btnContainer.innerHTML = '';
                buttons.forEach(b => {
                    const btn = document.createElement('button');
                    btn.className = b.class;
                    btn.innerText = b.text;
                    btn.setAttribute('onclick', b.onclick);
                    btnContainer.appendChild(btn);
                });

                document.getElementById('customModal').classList.remove('hidden');

            closeModal() {
                document.getElementById('customModal').classList.add('hidden');

                const viewEl = document.getElementById('appView');
                viewEl.innerHTML = '';

                if (appState.currentView === 'home') {
                    viewEl.innerHTML = this.renderHomeView();
                } else if (appState.currentView === 'study') {
                    viewEl.innerHTML = this.renderStudyView();
                } else if (appState.currentView === 'quiz') {
                    viewEl.innerHTML = this.renderQuizContainerView();
                    this.renderQuizQuestion();
                } else if (appState.currentView === 'result') {
                    viewEl.innerHTML = this.renderResultView();
                } else if (appState.currentView === 'review') {
                    viewEl.innerHTML = this.renderReviewView();

                                    ${answeredCount > 0 ? `<div class="flex justify-between text-xs text-slate-500 dark:text-slate-400 pt-1"><span>Acertos: <strong class="text-emerald-600 dark:text-emerald-400">${correctCount}</strong></span><span>Erros: <strong class="text-rose-600 dark:text-rose-400">${answeredCount - correctCount}</strong></span></div>` : ''}
                                </div>

                            <div class="grid grid-cols-2 gap-2 pt-4 border-t border-slate-100 dark:border-slate-800">

                                    <i class="fa-solid fa-book-open"></i>
                                    <span>Estudar</span>

                                    <i class="fa-solid fa-play"></i>
                                    <span>${answeredCount > 0 ? 'Continuar' : 'Iniciar'}</span>
                                </button>
                            </div>
                        </div>
                    `;
                }

                // Overall stats
                let totalAnswered = 0;
                let totalCorrect = 0;
                questionsData.forEach(q => {
                    const a = appState.userAnswers[q.id];
                    if (a && a.answered) {
                        totalAnswered++;
                        if (a.correct) totalCorrect++;
                    }
                });
                const overallPct = Math.round((totalAnswered / 160) * 100);

                return `
                    <div class="space-y-8 animate-fade-in">
                        <!-- Hero Banner -->
                        <div class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 rounded-3xl p-6 sm:p-10 text-white shadow-xl relative overflow-hidden">

                                        <i class="fa-solid fa-graduation-cap"></i>
                                        <span>Área de Estudos (Resumos)</span>

                                    ${totalAnswered > 0 ? `

                                            <i class="fa-solid fa-clipboard-check"></i>

                            </div>

                                <span class="text-xs text-slate-500 dark:text-slate-400">Cada bloco possui exatamente 40 questões</span>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                ${blocksHtml}
                            </div>
                        </div>
                    </div>
                `;
            },

            startBlock(bloco) {
                appState.activeBloco = bloco;
                // Find first unanswered question in this block, or default to 0
                const blockQs = questionsData.filter(q => q.bloco === bloco);
                let firstUnansweredIdx = blockQs.findIndex(q => !appState.userAnswers[q.id] || !appState
                    .userAnswers[q.id].answered);

            },

                    <div class="space-y-6 animate-fade-in max-w-4xl mx-auto w-full">

                                <i class="fa-solid fa-play"></i>

            renderQuizContainerView() {

                return `

                                            <i class="fa-solid fa-rotate-right mr-1"></i>Reiniciar

            renderQuizQuestion() {
                const b = appState.activeBloco;
                const blockQs = questionsData.filter(q => q.bloco === b);
                const idx = appState.currentQuestionIndex;
                const q = blockQs[idx];
                if (!q) return;

                const userAnsObj = appState.userAnswers[q.id] || {};
                const selectedLetter = userAnsObj.selected || null;
                const isAnswered = userAnsObj.answered || false;
                const isCorrect = userAnsObj.correct || false;

                // Update Header Stats
                const answeredCount = blockQs.filter(item => appState.userAnswers[item.id] && appState.userAnswers[
                    item.id].answered).length;
                const correctCount = blockQs.filter(item => appState.userAnswers[item.id] && appState.userAnswers[
                    item.id].correct).length;
                const errCount = answeredCount - correctCount;

                const headerStatsEl = document.getElementById('quizHeaderStats');
                if (headerStatsEl) {
                    headerStatsEl.innerHTML =
                        `Acertos: <strong class="text-emerald-600">${correctCount}</strong> | Erros: <strong class="text-rose-600">${errCount}</strong> | Respondidas: <strong>${answeredCount}/40</strong>`;
                }

                const pct = Math.round(((idx + 1) / 40) * 100);
                const progTextEl = document.getElementById('progressTextLabel');
                const progPctEl = document.getElementById('progressPercentLabel');
                const progBarEl = document.getElementById('quizProgressBarFill');
                if (progTextEl) progTextEl.innerText = `Questão ${idx + 1} de 40`;
                if (progPctEl) progPctEl.innerText = `${pct}% concluído`;

                // Difficulty badge color
                let diffClass = "bg-blue-50 text-blue-700 dark:bg-blue-950/60 dark:text-blue-400 border-blue-200";

                if (q.dificuldade === "Médio/Alto") diffClass =
                    "bg-orange-50 text-orange-700 dark:bg-orange-950/60 dark:text-orange-400 border-orange-200";
                if (q.dificuldade === "Difícil") diffClass =
                    "bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-400 border-rose-200";

                let alternativesHtml = '';
                const letters = ["A", "B", "C", "D"];

                letters.forEach(letter => {
                    const altText = q.alternativas[letter];
                    const isSelected = selectedLetter === letter;

                    let cardStyle =
                        "bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-blue-300 dark:hover:border-blue-700";

                    if (isAnswered) {

                }

                    const ans = appState.userAnswers[item.id];
                    let dotColor = "bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400";

                const wrapper = document.getElementById('questionCardWrapper');
                wrapper.innerHTML = `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 shadow-sm space-y-6 flex-1 flex flex-col justify-between">
                        <div class="space-y-6">

                            <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-slate-100 dark:border-slate-800">

            renderResultView() {
                const b = appState.activeBloco;

                const answeredCount = blockQs.filter(q => appState.userAnswers[q.id] && appState.userAnswers[q.id]
                    .answered).length;
                const correctCount = blockQs.filter(q => appState.userAnswers[q.id] && appState.userAnswers[q.id]
                    .correct).length;
                const errCount = answeredCount - correctCount;
                const pct = answeredCount > 0 ? Math.round((correctCount / 40) * 100) : 0;
                const errPct = 100 - pct;

                // Difficulty breakdown
                const diffs = ["Fácil", "Médio", "Médio/Alto", "Difícil"];
                let diffStatsHtml = '';
                diffs.forEach(d => {
                    const dQs = blockQs.filter(q => q.dificuldade === d);

                    const dCorr = dQs.filter(q => appState.userAnswers[q.id] && appState.userAnswers[q.id]
                        .correct);
                    const dPct = dAns.length > 0 ? Math.round((dCorr.length / dQs.length) * 100) : 0;

                    diffStatsHtml += `
                        <div class="bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 flex flex-col justify-between">

                                    <span class="text-2xl font-extrabold text-slate-900 dark:text-white">40</span>

                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="app.toggleReviewFilter(false)" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${!appState.reviewedOnlyErrors ? 'bg-blue-900 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">
                                    Todas (${questionsData.filter(q => appState.userAnswers[q.id] && appState.userAnswers[q.id].answered).length})
                                </button>
                                <button onclick="app.toggleReviewFilter(true)" class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all ${appState.reviewedOnlyErrors ? 'bg-rose-600 text-white shadow-md' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">
                                    Apenas Erradas (${questionsData.filter(q => appState.userAnswers[q.id] && appState.userAnswers[q.id].answered && !appState.userAnswers[q.id].correct).length})
                                </button>
                            </div>
                        </div>

                        <div class="space-y-4">
                            ${itemsHtml}
                        </div>
                    </div>
                `;
            },

            toggleReviewFilter(onlyErrors) {
                appState.reviewedOnlyErrors = onlyErrors;
                this.render();
            }
        };

        // Initialize application on window load
        window.onload = function () {
            app.render();
        };
    </script>
</body>

</html>
